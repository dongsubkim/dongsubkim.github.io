about_content: | # this will include new lines to allow paragraphs  
  I am a dedicated server developer with over 3 years of experience who enjoys solving complex business challenges through code. 
  My expertise includes designing and implementing Supply Chain Management (SCM), Order Management Systems (OMS), and secure, 2FA-based account management solutions.

  My primary technologies are Kotlin and Spring, and I enhance development efficiency by automating repetitive tasks and actively refactoring code. 
  I always prepare clear, detailed technical designs to align closely with team practices, and continuously improve service quality and maintainability through routine code reviews.

  I highly value unit testing, consistently maintaining test coverage above 85%, and continuously look for ways to further improve it. 
  Additionally, I set team-wide coding conventions and development guidelines to enhance readability and maintainability.


