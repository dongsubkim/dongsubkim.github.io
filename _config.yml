    sub_title: Filter-coffee brewing log · Personal project
    link: https://www.mogumcoffee.app
    link_text: mogumcoffee.app
    description: |-
      - Connects recipes with the beans and gear you own, runs the brew, and records conditions and results for the next one. Running as a PWA; a React Native (Expo) app is planned.
      - Sole owner from product design through the Kotlin/Spring Boot API (PostgreSQL, Spring Data JPA, Flyway, OAuth2/JWT), the Next.js web app, deployment and operations. TypeScript client generated from the OpenAPI contract; Testcontainers-based PostgreSQL integration tests cover authorization and data-preservation paths.
      - Implementation is Codex-driven while product decisions, domain model, API contract and test criteria are mine; work is split across role-based subagents to keep context and token use small. Design examples: each brew stores an immutable snapshot of recipe revision, beans, gear and actual conditions, decoupled from later edits; the timer runs on a client clock and replays events with the same IDs and order after a temporary offline gap.
