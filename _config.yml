  - title: "Selected Projects"
    layout: list
    content:
      - layout: top
        title: "Migrating 181,140 support tickets from a third-party ticketing system"
        caption: "Sendbird"
        description: |
          Migrated and validated **181,140 tickets** with rerunnable batches and record-level checks.

          <details class="project-details" markdown="1">
          <summary>Read the case study</summary>

          **Problem**

          A customer was moving primary email support from Sprinklr to Sendbird's ticketing product with an AI agent in front. No migration tool, API or runbook existed, and correctness had to be proven against real customer data.

          **What I did**

          Owned the product-side implementation and production execution (chat/AI extraction was a teammate's). Mapped identifiers, statuses and email payloads so historical threads rendered correctly; made the migrator idempotent so any batch could be rerun; set ticket status programmatically to avoid overloading auto-routing; rebuilt the search index (~220k); wrote a post-batch validation script that checked every source record had a matching ticket. When one batch showed 6,988 vs 6,977 entries, I traced the gap to 11 late mappings instead of assuming loss. Rolled back immediately when a related deploy hit a duplicate-index failure.

          **Result**

          181,140 tickets migrated and validated (March 2026). The learnings informed a reusable Zendesk → Sendbird engine, implemented and validated in demos: a single orchestrator over three services, 300-second-safe chunked jobs, pre-flight checks, cross-organization email aliasing, and reconcile loops for lost callbacks.

          **Tech**

          Python, Django ORM, Celery, S3, OpenSearch, debug-pod execution, validation scripts.

          </details>

      - layout: top
        title: "Distributed rate limiting and traffic control for a chat API gateway"
        caption: "Sendbird"
        description: |
          Built distributed traffic control and verified **47/47 checks across two gateway pods**.

          <details class="project-details" markdown="1">
          <summary>Read the case study</summary>

          **Problem**

          The next-generation chat platform's gateway needed per-app/user/IP limits with multiple time windows, default and custom policies, manual blocking, and consistent behavior across pods — on a serverless Redis with slot constraints.

          **What I did**

          Designed and built it in Kotlin / Spring Cloud Gateway: policies in MySQL (Flyway/JPA) → Redis snapshot → bounded local cache with Pub/Sub invalidation; Valkey atomic counters; standard 429 responses with adaptive denial; manual blocking with MySQL audit and propagation; Okta-protected Backoffice APIs/UI; an Edge-only config API with ETag/304; decision logs and Prometheus counters shipped through Fluent Bit to BigQuery and Grafana. Found a failure that only appeared on serverless Redis — the final Lua PUBLISH failing returned 503 while state had already changed — and split state updates from notifications.

          **Result**

          47/47 manual-block checks passed in a live region across two pods, with 12 admin operations matched against audit/revision records. Also designed bidirectional pre-shared-key authentication across gateway, chat core and ticketing product after inventorying 39 APIs.

          **Tech**

          Kotlin 2.3, JDK 25, Spring Cloud Gateway, Flyway/JPA, Redis/Valkey, Lua, Okta, Prometheus, Fluent Bit, BigQuery.

          </details>

      - layout: top
        title: "Agent-statistics API: 64s → 5.88s"
        caption: "Sendbird"
        description: |
          Reduced response time from **64s to 5.88s (−91%)** on an 11,857-agent workload.

          <details class="project-details" markdown="1">
          <summary>Read the case study</summary>

          **Problem**

          For a customer with 11,857 agents, the agent-statistics endpoint loaded every agent with related data and serialized all of it before paginating, taking ~64 seconds and causing 502s.

          **What I did**

          Queried lightweight IDs/display names first, deferred heavy `select_related`/prefetch and serialization to the 20 agents on the page, and removed repeated QuerySet evaluation that re-ran subqueries per filter. Confirmed the gain with Data Infra and the customer's monitoring.

          **Result**

          64s → 5.88s (−91%) on the same workload. Follow-ups: −40% DB queries in the metrics collector, cursor pagination, search-index counts, cached per-request permission lookups.

          **Tech**

          Django ORM, MySQL, OpenSearch, SQL commenter-based regression tests.

          </details>

      - layout: top
        title: "EC2 → Kubernetes migration of an internal operations service"
        caption: "Sendbird"
        description: |
          Moved an internal service to **Kubernetes**, confirming zero residual EC2 traffic before retirement.

          <details class="project-details" markdown="1">
          <summary>Read the case study</summary>

          **Problem**

          One internal service still ran on EC2 VMs with its own build, secrets and worker setup, diverging from the Kubernetes-managed platform.

          **What I did**

          Owned the application side with the infrastructure team: Docker and GitHub Actions, Helm charts and values, ArgoCD release flow, External Secrets/Doppler, health checks, Redis/MySQL TLS, worker/beat cut-over; staged rollout (staging → production), then checked logs/Grafana for residual EC2 API traffic before requesting decommission. Later tuned Gunicorn worker recycling after quantifying memory pressure (~4.3k calls in 39 minutes).

          **Result**

          Zero residual traffic confirmed and EC2 retired; the service now builds, deploys and operates like the rest of the platform; OpenTelemetry tracing followed across four services.

          **Tech**

          Kubernetes (EKS), Helm, ArgoCD, GitHub Actions, External Secrets, ElastiCache, OpenTelemetry/Tempo, Grafana.

          </details>

      - layout: top
        title: "AI-voice-to-human call handoff"
        caption: "Sendbird"
        description: |
          Built an idempotent call-handoff backend, validated in a **347-test integration PR**.

          <details class="project-details" markdown="1">
          <summary>Read the case study</summary>

          **Problem**

          When an AI voice agent needs to hand a live call to a human, offers, acceptances, declines, timeouts, hang-ups and webhooks arrive asynchronously, and agent occupancy and ticket state must stay consistent.

          **What I did**

          Built the domain model (VoiceCallSession keyed by conversation for idempotency), a project-level routing coordinator with offer/accept/decline APIs, join-token and recording lookups, AI-agent webhook processing, timeout lifecycle, and guards for occupied agents and ordinary ticket-change paths; excluded voice tickets from chat routing capacity; two QA rounds.

          **Result**

          MVP merged with a 347-test integration PR; follow-ups for eligibility sync and async routing after decline.

          **Tech**

          Django, Celery, webhook idempotency, state machines, Open Channel events.

          </details>

      - layout: top
        title: "Turning a mail-queue alert into an outbound-timeout standard"
        caption: "Sendbird"
        description: |
          Replaced unbounded outbound requests with a shared timeout standard across **172 files**.

          <details class="project-details" markdown="1">
          <summary>Read the case study</summary>

          **Problem**

          A worker alert on mail delivery kept firing. Increasing worker capacity alone would not address the cause.

          **What I did**

          Traced the code paths: long organization-sync tasks were starving the default Celery queue, and outbound HTTP calls had no timeouts. Added mail-queue health metrics and PagerDuty-visible alerts, an immediate single-mail send path, queue separation, and then a shared HTTP client with timeout coverage across 172 files, a guard against new unbounded `requests` calls, and queue-fairness fixes in two more services.

          **Result**

          Addressed the failure mode with bounded HTTP calls and queue separation; the same pattern was reused for later incidents.

          **Tech**

          Django, Celery, requests, Prometheus/Grafana, PagerDuty.

          </details>

      - layout: top
        title: "AI-assisted engineering as a team capability"
        caption: "Sendbird"
        description: |
          Shared **30+ reusable AI coding workflows and 14 custom agents** with the team.

          <details class="project-details" markdown="1">
          <summary>Read the case study</summary>

          **Problem**

          As a new engineer in services with years of accumulated behavior, answering customer questions or debugging incidents meant searching code, Confluence, Jira, Slack, DB rows and logs one source at a time.

          **What I did**

          Built 30+ reusable Claude Code / Codex skills and 14 custom agents: release/deploy automation (CalVer tags, dev/official workflows, multi-region deploy PRs), Slack review requests, Jira-keyed worktrees, daily/weekly evidence logs, debug-pod execution, BigQuery/Grafana/Sentry access, a spec-first design → implementation → review → release pipeline. Shared them with the team and used them for live cross-system forensics on production pods.

          **Result**

          Faster ramp-up and customer answers backed by production evidence; teammates run releases and review requests from the same skills. Every agent-produced result is verified against real system behavior before it ships.

          **Tech**

          Claude Code, Codex CLI, MCP servers, Python tooling.

          </details>

