about_content: |
  I am a backend engineer with 5+ years of experience building customer-facing platforms. At Sendbird, I work on customer-support ticketing, the customer dashboard platform, and a chat API gateway. Previously, I owned seller-account, supply-chain, and logistics services at Bucketplace.

  My work includes migrating **181,140 support tickets** and reducing an agent-statistics API from **64s to 5.88s**. I build with Python/Django and Kotlin/Spring on Kubernetes, document technical decisions, verify changes against production behavior, and share reusable tools with my team.

content:
  - title: "Highlights"
    layout: text
    content: |
      - **181,140 tickets** migrated from a third-party ticketing system into Sendbird's product and validated; generalized into a reusable Zendesk → Sendbird migration engine.
      - **64s → 5.88s (−91%)** on an agent-statistics API for an 11,857-agent customer; −40% DB queries in metrics collection.
      - **EC2 → Kubernetes** migration of an internal service, **ElastiCache/TLS** for three services, **OpenTelemetry** tracing across four.
      - **Distributed rate limiting, traffic blocking and service authentication** for a chat API gateway in Kotlin/Spring Cloud Gateway.
      - **724 PRs authored, 1,744 reviewed, 75 design/RCA docs** in 13 months; **30+ AI-agent workflows** shared with the team.

  - title: "Experiences"
    layout: list
    content:
      - layout: top
        title: "Sendbird"
        sub_title: "Software Engineer, Comms Applications (Backend)"
        caption: "September 2025 – Present · Seoul"
        description: |
          Backend for Sendbird Desk (customer-support ticketing with AI agents), the customer dashboard platform (accounts, permissions, billing, internal operations) and the next-generation chat API gateway (Kotlin).

          **Ticketing-system migrations**
          - Owned backend design and production execution of the company's first support-history migration from a third-party ticketing system into the AI-fronted ticketing product: rerunnable idempotent migrators, identifier/status mapping, search-index rebuild (~220k documents), post-batch validation — **181,140 tickets migrated and validated**.
          - Built and demo-validated a reusable Zendesk → Sendbird migration engine: chunked self-chaining jobs within worker time limits, email-only export source, pre-flight checks, cross-organization identity aliasing, staleness reconcile with heartbeat/lease.

          **Performance and reliability**
          - Cut the agent-performance statistics API from **64s to 5.88s (−91%)** for a customer with 11,857 agents (paginate first, defer ORM prefetches, remove repeated QuerySet evaluation); −40% database queries in the metrics collector; cached hot-path permission lookups (3 → 1 SELECT per request).
          - Made ticket closing concurrency-safe (row lock, commit-then-publish) and built async bulk closing with Redis job state and per-project single-active slots, sized from production latency (close p50 0.22s → 100 tickets in ~20–30s).
          - Root-caused production incidents from data: a mail-queue alert → outbound HTTP timeout standard (8-PR stack); 60s+ settings-copy timeouts → async; a 50% account-creation race fixed same day; a read-replica saturation where one SELECT drove 98% of load; stranded deletion runs recovered.

          **Platform**
          - Led the application side of moving an internal operations service from EC2 VMs to **Kubernetes (EKS)** with the infrastructure team (Docker/GitHub Actions/Helm, ArgoCD, External Secrets, worker/beat cut-over), verifying zero residual EC2 traffic before decommission.
          - Moved three services from RabbitMQ and in-cluster Redis to managed ElastiCache with Redis/MySQL TLS; rolled OpenTelemetry trace-context logging across four services and wrote the onboarding guide.
          - Built **distributed rate limiting** for the chat API gateway in **Kotlin / Spring Cloud Gateway**: MySQL/Flyway policy store → Redis snapshot → local cache with Pub/Sub invalidation, atomic multi-window counters, standard 429 + adaptive denial; manual traffic blocking with audit trail; Okta-protected admin APIs/UI; Edge config API with ETag; decision logs to Prometheus and BigQuery. Found and fixed a partial-write failure that appeared only on serverless Redis (47/47 live checks across two pods).
          - Designed and implemented bidirectional pre-shared-key authentication between the gateway, chat core and ticketing product after inventorying 39 APIs across 52 files.

          **Product features (end to end with FE/PM/QA)**
          - AI-voice-to-human call handoff: idempotent call sessions keyed by conversation, routing coordinator (offer/accept/decline), webhook-driven state transitions, timeouts, occupied-agent guards (347-test integration PR).
          - Time-based ticket automation: rule CRUD/validation/reorder plus a Celery scheduling runtime with due-time calculation, bounded per-project dispatch, lease recovery and version fencing.
          - Customizable manager reports: immutable presets/revisions/publications, data-platform and LLM integrations with guards, ACL sharing, stateless preview, async CSV/ZIP export.
          - Outbound (proactive) customer email with AI-agent selection; Jira OAuth integration (first ownership, shipped within weeks of joining); actual-handling-time analytics and export; backend for a project-scoped group-channel event bus; language-aware assignment rules with backup teams; Platform API rate limiting.

          **Security and compliance**
          - Customer-facing audit/access-log API served from BigQuery (retention and rate limits, auth-endpoint exclusion, PII purge, public docs); GDPR sub-processor notification system; AI-agent role access modes with a zero-data-loss three-phase rollout (dual-write → backfill → cleanup); Dashboard OTP customer-approval flow; CloudFront signed-URL downloads; 10+ vulnerability remediations.

          **Engineering velocity**
          - Stacked-PR CI policy and cached test images with parallel service start-up across four repositories; multi-region release automation (13–14 regions per release).
          - 30+ reusable AI coding-agent skills and 14 custom agents (release/deploy, review loops, Jira/worktree setup, evidence logs, debug-pod forensics) adopted by the team; a 54k-character implementation guide that let a teammate ship parent–child tickets.
          - 724 PRs authored (669 merged), 1,744 PRs reviewed, 441 Jira issues, 75 Confluence pages (54 design/RCA/runbook docs) across 11 repositories.

      - layout: top
        title: "Bucketplace (오늘의집)"
        sub_title: "Software Engineer"
        caption: "September 2021 – September 2025 · Seoul"
        description: |
          **Seller (partner) account service**
          - Built a Kotlin/Spring MSA seller-account service replacing a Ruby on Rails monolith; migrated **~40,000 accounts** with dual-write logic for uninterrupted service.
          - Moved from session-based auth to **JWT + Redis with email/SMS two-factor authentication**. [Technical write-up](https://speckle-neem-ab4.notion.site/SMS-Email-2-0fa9323fdf444e5cbacb325664085209?pvs=4)
          - OTP-secured JWT impersonation for internal staff; Spring Cloud Gateway auth filters shared across microservices; standardized error handling and API exception responses (76.3% test coverage).

          **Supply Chain Management (SCM)**
          - Built the Kotlin/Spring purchase-order/inbound microservice that replaced manual processes, improving data accuracy and traceability.
          - **Multi-database transactions (MongoDB + MySQL)** through custom Hibernate interceptors. [Technical write-up](https://speckle-neem-ab4.notion.site/MySQL-MongoDB-a53d3a06551d47d78cb8536a27888e8f?pvs=4)
          - Single- to multi-center logistics; redesigned ordering, inbound and order-creation processes.
          - Regional direct shipping: **−15% product damage rate, −27% delivery lead time**; cross-MSA shipping-capacity integration: **~20M KRW/month outsourcing cost and 166 working hours/month saved**.
          - Introduced Detekt, ktlint and JaCoCo; resolved 814 code smells and raised coverage by 10 percentage points.

          **Logistics renewal & SAP integration**
          - Redesigned purchase-order/inbound data models for SAP and external-system integration, migrating **~176,000 records** to a new codebase.
          - Defined requirements and priorities directly with operations teams in the absence of a product owner.
          - Backordering system enabling orders without pre-existing inventory; monorepo architecture removing duplicated code; **87.6–95.9% test coverage**; Spring Boot 2 / JDK 11 → Spring Boot 3 / JDK 21.

