  - layout: top
    title: 1. Migrating 181,140 support tickets from a third-party ticketing system, and the migration engine that came out of it
    caption: Sendbird · 2026.01 – 07 · Python/Django, Celery, MySQL
    description: |-
      <div id="project-1" class="project-anchor" tabindex="-1"></div>

      181,140 tickets migrated and validated; the approach became a reusable Zendesk → product migration engine.

      <details class="project-details" markdown="1">
      <summary>Read the case study</summary>

      - **Problem.** A customer had to move its entire support history from a third-party ticketing system into our ticketing product with an AI agent in front. No migration tool, API or runbook existed.
      - **Why it mattered, and the constraints.** This was real customer support data: no loss and no duplicates. The existing service and its auto-assignment logic had to keep working during the migration. The source API's rate limits, field-length limits, deleted categories and null values surfaced at every step.
      - **Role and decisions.** I owned the product-side implementation and the production execution for email-based tickets (a teammate handled the chat/AI side), then generalized the work into a Zendesk migration API for tickets, customers and agent accounts and released it.
        - *Cutover approach.* The customer's support team worked fixed hours, so a short downtime outside those hours was acceptable. I confirmed that first, then chose pre-migration → short cut-over → delta re-collection over fully continuous sync: three years of history were migrated ahead of time; inbound email routing was switched from the old system to ours; mail that landed in the old system in between was re-fetched by `updated_at` in two or three passes until nothing new appeared.
        - *Rerunnable by design.* Because API limits, oversized fields, deleted categories and nulls were expected in every batch, the migrator was idempotent on external identifiers from the start: a failed batch is fixed for its cause and rerun.
        - *Verification.* Each batch was checked by a script comparing source records with created tickets. When counts disagreed (6,988 vs 6,977), I traced it to 11 delayed mappings rather than assuming loss.
      - **Result.** 181,140 tickets migrated and validated. The approach became a reusable Zendesk → product migration engine: a single orchestrator, chunk chaining inside a 300-second worker limit, preflight checks, cross-organization email alias handling, and a reconcile loop for lost callbacks.
      - **Tech.** Python, Django ORM, Celery, MySQL, OpenSearch, validation scripts run from debug pods.

      </details>
  - layout: top
    title: 2. Distributed rate limiting and traffic control for a chat API gateway
    caption: Sendbird · 2026.07 – 10 · Kotlin / Spring Cloud Gateway, JPA, MySQL, Valkey (Redis)
    description: |-
      <div id="project-2" class="project-anchor" tabindex="-1"></div>

      Distributed rate limiting, traffic blocking and PSK authentication implemented; in QA as of October 2026.

      <details class="project-details" markdown="1">
      <summary>Read the case study</summary>

      - **Problem.** The gateway of the next-generation chat platform had no per-app/user/IP limits, no multi-window budgets, no default/custom policies and no manual blocking, and every pod had to apply the same policy consistently.
      - **Why it mattered, and the constraints.** The gateway is the single path for all traffic, so it must add almost no latency while protecting availability; counters and settings must agree across pods. The production Redis was serverless (slot constraints), and policy changes had to propagate in near real time.
      - **Role and decisions.** I owned research, design, implementation and verification of rate limiting and traffic control for the new gateway.
        - *Algorithm.* The legacy platform used a custom GCRA limiter that ran a heavy Lua script on every request and loaded Redis. The new backend serves mostly 1:1 conversations between an AI agent and a customer, so it does not need to absorb the thousands-of-users-in-one-channel bursts the chat SDK sees. After sharing a comparison with the team I chose multi-window fixed-window counters: cheap to compute, and splitting into 1-second and 60-second windows catches short bursts while still enforcing ordinary limits. All windows of one rule/scope are checked and updated atomically in one small Lua script.
        - *Policy structure.* Customers are on different plans with different volumes, so limits had to be adjustable per customer: default rules with per-customer custom rules on top. Policies live in MySQL and propagate as a Redis snapshot and pod-local cache; Pub/Sub invalidation is backed by revision polling so a lost notification cannot leave a pod stale.
        - *Blocking.* Abnormal traffic had reached the legacy system before and had to be stopped by the system, not by a person. Three layers, ordered by where blocking is cheapest: early deny of IPs before authentication, manual blocking of user/app IDs from the back-office at the very front (with an audit trail), and adaptive deny that cuts off callers who keep hitting the limit after being throttled.
        - *Service-to-service auth.* Designed and built PSK authentication between the gateway and internal services (chat core, ticketing product). The ticketing product, which I own, accepts both the legacy chat auth and the new one behind a flag, so the switch is decoupled from code deploys.
      - **Result (in QA).** Policy storage, propagation and counters, admin API and UI, early/adaptive deny and PSK auth are implemented; decision logs for throttled users/apps flow to Grafana and BigQuery through a pipeline built with the data-platform team. Expected effect at launch: lower Redis load than the per-request Lua path. Compute/DB savings from replacing the legacy chat system are not yet measured.
      - **Tech.** Kotlin, Spring Cloud Gateway, Spring Data JPA, MySQL, Valkey/Redis (Lua), Pub/Sub, Grafana, BigQuery.

      </details>
  - layout: top
    title: '3. Building the SCM and changing its shape: multi-center, partner inbound scheduling, backorders on virtual inventory, SAP integration'
    caption: Bucketplace · 2022 – 2025 · Kotlin/Spring, JPA, MySQL, MongoDB
    description: |-
      <div id="project-3" class="project-anchor" tabindex="-1"></div>

      Four years evolving the SCM from spreadsheets into multi-center logistics, partner scheduling, backorders and SAP integration.

      <details class="project-details" markdown="1">
      <summary>Read the case study</summary>

      - **Problem.** Purchase orders and inbound receiving ran on manual work and spreadsheets. After they were systematized, growth kept forcing structural change: one warehouse became several; inbound schedules were negotiated by phone and tracked in spreadsheets; orders could not exceed on-hand stock; purchase orders and inventory had to be integrated with SAP.
      - **Why it mattered, and the constraints.** Logistics cannot pause, so purchase orders, receiving and shipping had to keep flowing while the structure changed underneath. Business rules with many edge cases — inter-center transfers, outbound-center selection — had to be encoded correctly. For the SAP work there was no product owner, so requirements were defined directly with operations.
      - **Role and decisions.** I owned the SCM backend for four years.
        - *Backorders, which I proposed, then virtual inventory.* Orders could not be taken before stock arrived. Furniture delivery happens well after purchase, and the inbound-reservation system told us when each SKU would arrive and in what quantity, so I proposed taking orders against reserved inbound quantity. We started with a minimal scope to confirm operations could absorb it, then moved to virtual inventory: operations set, per SKU, what share of the reserved quantity may be sold (low for SKUs with high damage rates, high for reliable ones). Escalation rules — emergency purchase orders, delivery-date changes agreed with the customer — were defined with the operations team.
        - *The center as a domain model.* With one warehouse, the center was a string baked into code. I redefined it as a domain model wired through every related entity and designed for more centers than two. Per-center stock for the same SKU, inter-center transfers and outbound-center selection had many edge cases, so I walked through the use cases with the PO in detail before building.
        - *Inbound scheduling as partner self-service.* Operations used to call each supplier and keep the schedule in a spreadsheet. Now a supplier who has received a purchase order books an open inbound slot on the partner portal and operations only approve. Per-center slots and time windows are admin-configurable, so schedule changes need no code change.
        - *SAP integration.* Scope and priorities were set with operations in the absence of a product owner. The purchase-order model was reworked to the SAP purchase-order spec, the inventory model extended so center stock flows to both the commerce system and SAP, and the purchase-order ERD and goods-receipt interface were redesigned in coordination with other teams and external systems.
        - *Change history.* Entity change history is log-like, so it stays out of the main transaction: snapshots gathered by Hibernate hooks are written to MongoDB after the MySQL commit, failures are isolated and reported to Slack for manual replay.
      - **Result.** Purchase orders and receiving went from spreadsheets and phone calls to a single-center SCM, and from there to a system that supports multiple centers, partner self-service scheduling, orders before stock arrives and SAP integration. ~176,000 legacy logistics records were migrated to the new models, and the schedule coordination and stock-buffer decisions that operations used to make by hand became system settings.
      - **Tech.** Kotlin, Spring Boot, Spring Data JPA, MySQL, MongoDB, Kafka, Spring Batch.

      </details>
  - layout: top
    title: 4. A database-load incident turned into a three-month query-optimization program
    caption: Sendbird · 2026.01 – 04 · Python/Django, MySQL, OpenSearch
    description: |-
      <div id="project-4" class="project-anchor" tabindex="-1"></div>

      A production incident became a three-month optimization program; a 502-causing API went from 64s to 5.8s.

      <details class="project-details" markdown="1">
      <summary>Read the case study</summary>

      - **Problem.** The ticketing product's MySQL in its busiest region kept hitting CPU spikes. Deep-offset polling by a large customer and count queries scanning months of rows were the cause, and one statistics API call for a customer with 11,857 agents once occupied every worker and produced a 502.
      - **Why it mattered, and the constraints.** Live support ran on this database, so schema and query changes had to happen in production without stopping the service. The search index (OpenSearch) lagged by about 30 seconds, so moving counts there risked inconsistency. Infrastructure (replica sizing, indexes, ProxySQL caching) belonged to the data-infrastructure team; application changes were mine; we split action items in a weekly sync (11 sessions).
      - **Role and decisions.** As the ticketing backend owner I reviewed slow and high-row-scan queries with the data-infrastructure team each week and owned the application side. For each query the question was whether an index would do, whether the query could be removed, or whether it belonged in another store — decided by measurement.
        - *Measure before fixing.* The 502 looked like a SQL problem, but reconstructing the timeline from nginx logs showed SQL at 6 seconds and serialization at 59. Instead of tuning the query I fixed serialization in two steps: remove unnecessary serializers (64s → 17s), then prefetch only the 20 agents on the page (5.8s).
        - *Remove the count or move it.* Dashboard count queries scanned months of rows on every request. List APIs moved to cursor pagination so the count disappeared; large-range counts that could not be removed moved to OpenSearch, with a MySQL fallback on mismatch or timeout because of the sync lag. I proposed an `updated_at` index, which the data-infrastructure team rolled out to all regions.
        - *Measure rather than rewrite.* Three proposed rewrites of the statistics query (CTE split, UNION split, JOIN removal) were benchmarked eight times on production data; all were 1.4–6.4× slower and were rejected. I fixed the query's actual filter bug (agent OR group) instead, and cut the metrics collector from 25 to 15 queries by removing duplicates, verifying identical results on 11 real-data cases across four regions.
        - *Timeouts by pattern.* 2,763 OpenSearch timeouts were split into three filter patterns; the timeout was reduced to 3 seconds and only the worst pattern routed to MySQL.
      - **Result.** The 502 was resolved the same week. By mid-March the data-infrastructure team's records showed lower overall database usage and fewer spikes in that region. In April the application-side action items were closed with numbers and the weekly sync ended. "Measure on real data, then change" became the pattern for later incidents.
      - **Tech.** Python, Django ORM, MySQL, OpenSearch, nginx logs, Grafana, BigQuery.

      </details>
  - layout: top
    title: 5. A seller-account platform replacing a Rails monolith
    caption: Bucketplace · Kotlin/Spring, Spring Cloud Gateway, MySQL, Redis
    description: |-
      <div id="project-5" class="project-anchor" tabindex="-1"></div>

      ~40,000 accounts migrated; partners gained multiple accounts with separate permissions.

      <details class="project-details" markdown="1">
      <summary>Read the case study</summary>

      - **Problem.** The legacy Ruby on Rails monolith allowed one account per partner. Partners shared credentials, and permissions could not be separated between people at the same partner.
      - **Why it mattered, and the constraints.** Partner accounts gate everything a seller does, so the switch could not break logins or lose accounts. The old and new systems had to coexist while every partner moved.
      - **Role and decisions.** I built the Kotlin/Spring seller-account service and its migration.
        - *Migration without a hard cutover.* A migration module read both the old and the new database, created accounts in the new service and kept both sides in sync with dual-write until the legacy path could be retired; ~40,000 accounts moved this way.
        - *Authentication.* JWT with Redis-backed sessions, email/SMS verification, and partner-consented OTP access for internal staff who need to act on a partner's behalf. Shared Spring Cloud Gateway authentication filters were built with the core authentication team so other services could rely on the same checks.
      - **Result.** ~40,000 accounts migrated; partners can hold multiple accounts with separate permissions; staff access is explicit and consented.
      - **Tech.** Kotlin, Spring Boot, Spring Cloud Gateway, Spring Data JPA, MySQL, Redis, JWT.

      </details>
