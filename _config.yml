      - layout: top
        title: Bucketplace (오늘의집)
        sub_title: Software Engineer
        caption: September 2021 - Present
        description: | # this will include new lines to allow paragraphs
          **Development and Enhancement of Supply Chain Management(SCM) Systems**  
          - Developed and deployed a Kotlin/Spring-based microservice architecture (MSA) for purchase-order/inbound management previously handled manually, significantly improving data accuracy and traceability.
          - Successfully implemented multi-database transactions integrating MongoDB and MySQL through customized Hibernate interceptors. ([Post](https://speckle-neem-ab4.notion.site/MySQL-MongoDB-a53d3a06551d47d78cb8536a27888e8f?pvs=4))
          - Transitioned from a legacy single-center logistics system to multi-center support, and redesigned ordering, inbound, and order creation processes.
          - Implemented regional direct shipping features, reducing the regional product damage rate by 15% and shortening delivery lead time by 27%.
          - Integrated shipping capacities across MSA systems, cutting monthly outsourcing costs by approximately 20 million KRW and saving an average of 166 monthly working hours.
          - Improved service quality and maintainability by introducing static code analysis tools (Detekt), linters (ktlint), and test coverage tool JaCoCo. Resolved 814 "code-smells" and improved overall test coverage by 10 percentage points.

          **Logistics Service Renewal & SAP Integration**
          - Fully redesigned data models for purchase-order/inbound management to support SAP and external system integration, resulting in migrating approximately 176,000 records onto a new codebase.
          - Independently defined requirements and project development priorities through direct communication with operational teams in the absence of a Product Owner (PO).
          - Designed and developed a backordering system that allows processing orders without pre-existing inventory, expanding customer purchasing flexibility.
          - Introduced new backend architecture combined with a monorepo structure to eliminate redundant and duplicated code, vastly improving maintainability.
          - Achieved exceptional test coverage (87.64% - 95.94%) to ensure high maintainability standards.
          - Upgraded legacy system infrastructure from Spring Boot 2/JDK 11 to Spring Boot 3/JDK 21 to address internal infrastructure compatibility issues.

          **O.rora (Partner Center) Account Service Development**
          - Built a Kotlin/Spring-based MSA partner account management service, replacing existing monolithic legacy system written in Ruby-on-Rails.
          - Successfully completed migration of approximately 40,000 legacy system accounts onto the new platform, and implemented dual-write logic for smooth service continuity.
          - Improved security by transitioning from legacy session-based authentication to JWT & Redis-based authentication with email/SMS two-factor authentication. ([Post](https://speckle-neem-ab4.notion.site/SMS-Email-2-0fa9323fdf444e5cbacb325664085209?pvs=4))
          - Implemented temporary internal staff access through a JWT user impersonation feature secured by OTP for enhanced operational workflows.
          - Built partner authentication filters using Spring Cloud Gateway to facilitate seamless integration across internal microservices.
          - Standardized error handling and API exception responses team-wide, improving readability and maintainability, achieving 76.3% test coverage within account services.
          
